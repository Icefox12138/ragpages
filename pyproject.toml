[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragpages"
version = "0.1.0"
description = "One command turns a PDF/scan library into a citation-grade SQLite database for agents: every chunk keeps its page, locator and provenance."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "ragpages contributors"}]
requires-python = ">=3.10"
keywords = ["rag", "pdf", "ocr", "sqlite", "citation", "provenance", "pipeline", "agent", "fts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Text Processing",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
pdfium = ["pypdfium2>=4.30"]
mupdf = ["pymupdf>=1.24"]
rapid = ["rapidocr-onnxruntime"]
kraken = ["kraken"]
paddle = ["paddleocr"]

[project.urls]
Homepage = "https://github.com/Icefox12138/ragpages"
Repository = "https://github.com/Icefox12138/ragpages"
Issues = "https://github.com/Icefox12138/ragpages/issues"

[project.scripts]
ragpages = "ragpages.cli:main"

[tool.setuptools]
packages = ["ragpages", "ragpages.ocr"]

[tool.setuptools.package-data]
ragpages = ["pipeline.yaml"]
