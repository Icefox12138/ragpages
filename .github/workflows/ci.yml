name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    name: selftest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: python -m pip install -e ".[pdfium]"
      - name: selftest (pypdfium2, the default parser)
        run: python -m ragpages.cli selftest

  selftest-mupdf:
    name: selftest (pymupdf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: python -m pip install -e ".[pdfium,mupdf]"
      - name: selftest (pymupdf)
        run: python -m ragpages.cli selftest --parser pymupdf
